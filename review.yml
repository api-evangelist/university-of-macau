- date: '2026-06-03'
  rating: 3
  summary: University of Macau operates a genuine, documented Data and Open Data API Platform at data.um.edu.mo
    (managed by ICTO) with JSON APIs across About UM, Academic, Facilities, Media, and Student categories,
    plus documented pagination, filtering, sorting, and response-code conventions. The home page, API
    operations docs, call examples, dataset listing, quickstart, and terms pages all return HTTP 200
    and were verified live. Access is gated behind UMPASS registration and an API key, and no anonymous
    public base URL (api.data.um.edu.mo returns 404) is documented, so no baseURL was asserted. No official
    University of Macau GitHub organization was found; github.com/UM belongs to University of Malaya,
    not Macau. No fabricated endpoints, keys, or base URLs were added.
