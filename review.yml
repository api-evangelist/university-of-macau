- date: '2026-09-01'
  rating: 4
  summary: 'Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
    surface before saving anything. The June 2026 review was right that UM runs a genuine ICTO open-data
    platform and right to refuse a fabricated baseURL, but it was wrong on two counts and both are now
    corrected. First, api.data.um.edu.mo is live: a bare GET on the host returns 404 because nothing
    is mounted at the root, but /service/media/events/all returns 401 with WWW-Authenticate: AzureApiManagementKey,
    which is what a registered, key-protected Azure API Management route looks like. That 404-versus-401
    split, plus the platform''s own anonymously readable developer-portal backend at /developer/apis?api-version=2022-04-01-preview,
    exposed the complete surface: 16 APIs, 19 operations, every path, every documented query parameter.
    An OpenAPI was reconstructed from that metadata and marked method: probed, because UM publishes
    none of its own — the portal''s export returns paths: {}. Second, the review missed the university''s
    strongest machine-readable surfaces entirely: UM''s own AD FS identity provider at websso.um.edu.mo
    publishes signed SAML 2.0 federation metadata and an OIDC discovery document, and UMMoodle publishes
    a live LTI 1.3 Advantage key set. Three surfaces that look like UM''s are not: library discovery
    is an Ex Libris Primo VE tenancy (853UOM_INST), the Scholars Hub repository runs third-party IR
    software behind an IP allowlist, and the GenAI chat is an Open WebUI deployment with API keys disabled.
    All three are recorded as tenant relationships rather than deleted or credited. Crossref member
    53643 and ROR 01r4q9n85 are recorded as registry memberships. No DataCite account and no OAI-PMH
    provider exists on any um.edu.mo host. No official GitHub organization exists — the earlier note
    about github.com/UM belonging to University of Malaya still holds, and github.com/university-of-macau
    and github.com/umacau are empty registrations with zero public repositories.'
