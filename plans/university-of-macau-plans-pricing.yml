description: >-
  There is no money in this API, and there is no open door either. The University of Macau Data and
  Open Data API Platform states plainly that "all data is free to use", subject to its Terms and
  Conditions — but access is gated on institutional identity, not payment. A caller must hold a
  UMPASS account, register the "OPEN DATA API PLATFORM" service on the ICTO Account Information
  page, sign in to data.um.edu.mo, and subscribe to the single published product, "UM Members", to
  be issued a primary and secondary subscription key. UMPASS is issued to University of Macau staff
  and students. So the honest reading of this platform's commercial model is: free of charge,
  closed to the public, and open data in the licensing sense rather than the access sense.
notes: >-
  Corrected 2026-09-01. The previous version described "library, repository, course, and
  open-metadata interfaces" and a "federation membership" tier; neither was evidenced. One product
  is published on the gateway and it is named UM Members.
sources:
- https://data.um.edu.mo/quickstart
- https://data.um.edu.mo/terms-and-conditions-of-use
- https://data.um.edu.mo/developer/apis?api-version=2022-04-01-preview
plans:
- id: university-of-macau-um-members
  name: UM Members
  type: free
  description: >-
    The one published Azure API Management product on the platform. Subscribing grants a
    subscription key valid across all sixteen data-set APIs; there is no per-dataset or per-scope
    granularity. Requires a UMPASS account and up to one hour for a new registration to take
    effect.
  entries:
  - label: Data and Open Data API access
    name: open_data_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
    notes: >-
      Price is zero; the effective limit is the unpublished product quota enforced at the gateway
      (403 Quota Exceeded / 429 Too Many Requests). See rate-limits/.
eligibility:
  public_signup: false
  gate: UMPASS institutional single sign-on
  detail: >-
    No anonymous or external developer registration path was found. The platform describes itself
    as giving "UM staff and students access to data published by UM".
