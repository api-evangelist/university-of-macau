        in: query
        required: false
        schema:
          type: string
        description: 'Booking status:  A, U, R, H, O, X, F, P, or N.

          Available (A) - The time slot is available for booking.

          Free Use (U) - If the time slot is not booked, eligible users can use the court for free, if
          the available time slot has been marked for usages, the status of the time slot will become
          free use.

          Reserved (R) - The time slot has been reserved for somebody.

          Hold (H) - The time slot has been held.

          Occupied (O) - The time slot has been booked.

          Closed (X) - The time slot is not open for booking.

          Not Available Due to Dependency (F or P) - The time slot is not available for booking because
          of courts dependency.

          Not Available Due to Priority (N) - The time slot is not available for booking because of courts
          priority.'
