adjacent:
- id: openapi-3.0
  conforms: false
  operator: institution
  evidence: >-
    The University of Macau publishes no OpenAPI. The Azure API Management developer portal will
    export one per API (https://data.um.edu.mo/developer/apis/events?export=true&format=openapi
    returns openapi 3.0.1), but every export comes back with `paths: {}` — the operations are
    defined in the gateway and are not carried into the exported document. The OpenAPI in this
    repository was reconstructed by API Evangelist from the portal's operations metadata and is
    marked method: probed for exactly that reason.
