apis:
  - aid: university-of-macau:data-platform
    name: UM Data and Open Data API Platform
    description: >-
      The University of Macau Data and Open Data API Platform provides JSON
      APIs to data published by UM, organized into categories including About
      UM (organizational units and public holidays), Academic (course catalog
      and courses offered), Facilities (facilities information), Media (news and
      events) and Student (student services information). The platform supports
      pagination, filtering, sorting, and standard HTTP response codes. Access
      requires registration and an API key obtained through UMPASS; data is
      free to use subject to the terms and conditions. No anonymous public base
      URL is documented, so baseURL is omitted.
