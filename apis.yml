apis:
- aid: university-of-macau:websso-idp
  name: UM Web SSO — institutional SAML 2.0 / OpenID Connect identity provider
  x-operator: institution
  x-operator-evidence: >-
    websso.um.edu.mo is under the university's own registrable domain and publishes a signed EntityDescriptor
    with entityID http://websso.um.edu.mo/adfs/services/trust. The realm lookup for um.edu.mo returns
    NameSpaceType "Federated", AuthURL https://websso.um.edu.mo/adfs/ls/ and FederationBrandName "University
    of Macau".
  description: >-
    UMPASS, the university's single sign-on, is served by UM's own AD FS farm. It publishes federation
    metadata as application/samlmetadata+xml — 71 KB, signed, carrying both an IDPSSODescriptor and an
    SPSSODescriptor, SAML 2.0 protocol support, SingleSignOnService over HTTP-POST and HTTP-Redirect,
    four SingleLogoutService endpoints and 128 declared claim types — and an OpenID Connect discovery
    document at /adfs/.well-known/openid-configuration. This is the university's strongest institution-operated
    machine-readable surface and the one class the June 2026 cohort profiling missed entirely. Macao has
    no national research-and-education identity federation, so there is no eduGAIN or InCommon aggregate
    entry to point at; the metadata is published directly by the institution.
  humanURL: https://websso.um.edu.mo/adfs/ls/IdpInitiatedSignon.aspx
  tags:
  - Identity Federation
  - SAML
  - OpenID Connect
  - Education
  properties:
  - type: IdentityFederation
    url: https://websso.um.edu.mo/FederationMetadata/2007-06/FederationMetadata.xml
  - type: OpenIDConfiguration
    url: https://websso.um.edu.mo/adfs/.well-known/openid-configuration
  - type: Authentication
    url: authentication/university-of-macau-authentication.yml
- aid: university-of-macau:entra-federation
  name: Microsoft Entra ID tenant federation for um.edu.mo
  x-operator: federation
  x-operator-evidence: >-
    https://login.microsoftonline.com/um.edu.mo/v2.0/.well-known/openid-configuration returns 200 with
    issuer https://login.microsoftonline.com/76eeec46-fe40-4e1b-ab42-1d6d9f91b8a9/v2.0 — UM's own tenant
    on a broker every Microsoft customer shares.
  description: >-
    The identity broker in front of UM's own IdP. Sign-in to data.um.edu.mo, UMMoodle and the GenAI chat
    starts at a Microsoft sign-in page and is redirected to websso.um.edu.mo, so the Entra tenant is a
    genuine institutional fact — the tenant is UM's — while the discovery documents and the federation
    metadata endpoint belong to Microsoft and are shared by every tenant. Recorded as a relationship,
    not as a contract.
  humanURL: https://login.microsoftonline.com/um.edu.mo/v2.0/.well-known/openid-configuration
  tags:
  - Identity Federation
  - OpenID Connect
  - Education
  properties:
  - type: OpenIDConfiguration
    url: https://login.microsoftonline.com/um.edu.mo/v2.0/.well-known/openid-configuration
- aid: university-of-macau:ummoodle-lti
  name: UMMoodle — LTI 1.3 Advantage platform
  x-operator: tenant
  x-operator-evidence: >-
    ummoodle.um.edu.mo is UM's host and UM's deployment, but the LTI implementation, the token endpoint
    and the web-services API are Moodle's product surface, not the university's engineering. Recorded
    as a tenant relationship rather than credited to UM as a contract.
  description: >-
    The University of Macau's Moodle learning management system publishes a live LTI 1.3 Advantage platform
    key set at /mod/lti/certs.php (200, application/json, RSA RS256 signing key), an OAuth 2.0 client-credentials
    token endpoint at /mod/lti/token.php and the OIDC initiation endpoint at /mod/lti/auth.php. A Moodle
    Web Services REST endpoint is live at /webservice/rest/server.php and answers an unauthenticated call
    with the Moodle invalidtoken exception, so it is deployed but token-gated. This is UM's only conformance
    with a named education-sector interoperability standard, and it arrives through the LMS.
  humanURL: https://ummoodle.um.edu.mo/
  tags:
  - Learning Management
  - LTI
  - Education
  properties:
  - type: JWKS
    url: https://ummoodle.um.edu.mo/mod/lti/certs.php
  - type: Conformance
    url: conformance/university-of-macau-conformance.yml
  - type: Documentation
    url: https://elearning.um.edu.mo/
- aid: university-of-macau:primo-discovery
  name: UM Library discovery — Ex Libris Primo VE tenancy
  x-operator: tenant
  x-operator-evidence: >-
    Discovery runs on umlibrary.primo.exlibrisgroup.com — Ex Libris's host, not UM's — under the institution-specific
    view identifier vid=853UOM_INST:umlibrary. The tenancy is UM's; the platform and any API contract
    are Ex Libris's.
  description: >-
    The University of Macau Library's catalog and discovery layer is an Ex Libris Primo VE tenancy. UM's
    institution code is 853UOM_INST and its view is umlibrary. No UM-operated library API exists; any
    Primo or Alma API belongs in Ex Libris's own profile and is deliberately not saved here. Recorded
    so the relationship survives without crediting the university for a vendor's contract.
  humanURL: https://umlibrary.primo.exlibrisgroup.com/discovery/search?vid=853UOM_INST:umlibrary
  tags:
  - Library
  - Discovery
  - Education
  properties:
  - type: LibraryCatalog
    url: https://umlibrary.primo.exlibrisgroup.com/discovery/search?vid=853UOM_INST:umlibrary
  - type: Documentation
    url: https://library.um.edu.mo/lib_homepage_en
- aid: university-of-macau:scholars-hub
  name: UM Scholars Hub — institutional repository
  x-operator: tenant
  x-operator-evidence: >-
    repository.um.edu.mo is UM's host, but the software is a third-party institutional-repository product:
    its robots.txt still carries the vendor's untranslated Chinese template comment referencing ir.las.ac.cn.
    The deployment and the content are UM's; the contract is not.
  description: >-
    澳門大學學者庫, the University of Macau's institutional repository and scholar profile system, indexing faculties
    and institutes, scholars, publications and subjects. It is not harvestable: /oai and /oai/request
    both return 404, /api/core/sites answers "Your IP is not allowed to access or harvest this resources!",
    and sign-in is via UMPASS. For a research university this is the notable absence — no OAI-PMH provider
    exists on any um.edu.mo host, so UM's research output is not machine-readable from the institution's
    own infrastructure.
  humanURL: https://repository.um.edu.mo/
  tags:
  - Research Repository
  - Research Data
  - Education
  properties:
  - type: ResearchRepository
    url: https://repository.um.edu.mo/
- aid: university-of-macau:genai-chat
  name: UM GENAI Chat — Open WebUI deployment
  x-operator: tenant
  x-operator-evidence: >-
    chat.genai.um.edu.mo is UM's host and UM's deployment, and /api/config identifies the software as
    "GENAI Chat (Open WebUI)" version 0.9.2. The contract is Open WebUI's; the deployment, the model access
    and the policy around it are UM's.
  description: >-
    The university's own generative-AI chat service for staff and students, an Open WebUI deployment authenticated
    by OIDC against UMPASS, with self-signup and the local login form disabled. Its unauthenticated /api/config
    and /health endpoints are readable; everything else returns "Not authenticated". Notably, enable_api_keys
    is false — there is no programmatic access to this surface at all, by deliberate configuration. UM
    publishes accompanying Guidelines on the Use of Generative Artificial Intelligence Tools at genai.um.edu.mo,
    which name Azure OpenAI as the backing service.
  humanURL: https://chat.genai.um.edu.mo/
  tags:
  - Artificial Intelligence
  - Generative AI
  - Education
  tags_raw:
  - AI
  - Generative AI
  - Education
