aid: university-of-macau
name: University of Macau
description: >-
  The University of Macau (UM), founded in 1981, is the leading public
  comprehensive research university of the Macao Special Administrative Region
  and is ranked #245 in the QS World University Rankings 2025. English is its
  main medium of instruction and around 80 percent of its faculty are recruited
  internationally. UM operates a public-facing Data and Open Data API Platform
  at data.um.edu.mo, managed by its Information and Communication Technology
  Office (ICTO), exposing JSON APIs across categories such as About UM,
  Academic, Facilities, Media, and Student data. Access requires registration
  and an API key via UMPASS, and the platform is primarily oriented toward UM
  staff and students.
