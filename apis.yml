aid: university-of-macau
name: University of Macau
x-type: university
x-category: Public Research University
description: >-
  The University of Macau (UM), founded in 1981, is the public comprehensive research university of
  the Macao Special Administrative Region, teaching mainly in English with a largely international
  faculty and a residential-college undergraduate model. Its programmable footprint is real but
  narrow, and it is almost entirely campus operations rather than research output. The Information
  and Communication Technology Office (ICTO) operates a Data and Open Data API Platform at
  data.um.edu.mo whose gateway, api.data.um.edu.mo, serves sixteen JSON APIs across nineteen
  operations: organizational units and public holidays, the course catalog and per-semester course
  offerings, car park availability, computer room PC status and reservations, shuttle bus arrival
  times, sports facilities and their bookings, door access control records, outdoor WiFi access
  logs, university news and events, residential college hostel bed spaces and student job
  vacancies. The platform documents pagination, filtering, sorting and a full response-code table
  with remediation guidance — better documentation discipline than most universities manage. It
  publishes no OpenAPI, however, and it is not callable by the public: every API requires a
  subscription key issued only to holders of a UMPASS account, which means UM staff and students.
  Two further institution-run surfaces are machine-readable and were missed by earlier profiling:
  UM's own AD FS identity provider at websso.um.edu.mo publishes signed SAML 2.0 metadata and an
  OpenID Connect discovery document, and its Moodle deployment publishes a live LTI 1.3 Advantage
  platform key set. Everything else that looks like a UM API belongs to somebody else — library
  discovery is an Ex Libris Primo VE tenancy, the UM Scholars Hub repository runs third-party
  institutional-repository software behind an IP allowlist with no OAI-PMH, and the university's
  GenAI chat is an Open WebUI deployment with API keys switched off. UM registers DOIs as a
  Crossref member and is identified in ROR; it holds no DataCite account.
type: Index
