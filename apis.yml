x-coverage:
  state: gated
  reason: auth_required
  generated: '2026-09-01'
  detail: >-
    The University of Macau operates a genuine institution-owned API platform and documents it
    unusually well, but no part of it can be called without a UMPASS account, which is issued only
    to UM staff and students. Every one of the sixteen APIs on api.data.um.edu.mo answers an
    unauthenticated request with 401 and an Azure API Management key challenge; the single
    published product, "UM Members", cannot be subscribed to from outside the institution. The
    surface itself is fully readable — the developer portal's own backend at
    /developer/apis?api-version=2022-04-01-preview is anonymously readable and yielded the complete
    API list, every operation, and every documented query parameter, which is how the OpenAPI in
    this repository was reconstructed — so this is coverage limited by credentials, not by
    obscurity. UM publishes no OpenAPI of its own (the portal's export returns paths: {}), no
    llms.txt, no apis.json, no /.well-known/api-catalog and no security.txt. Two further
    institution-operated machine-readable surfaces are fully open and are recorded here: the SAML
    2.0 federation metadata and OIDC discovery for UM's own AD FS identity provider, and the LTI
    1.3 key set on UMMoodle. What UM does not have is a research-output surface — no OAI-PMH
    provider exists on any um.edu.mo host, the institutional repository blocks harvesting by IP,
    and there is no DataCite account. No official University of Macau GitHub organization exists;
    github.com/university-of-macau and github.com/umacau are both empty registrations with zero
    public repositories and no profile, and neither is claimed here.
  evidence:
    - url: https://api.data.um.edu.mo/service/media/events/all
      status: 401
    - url: https://data.um.edu.mo/developer/apis?api-version=2022-04-01-preview
      status: 200
    - url: https://data.um.edu.mo/
      status: 200
    - url: https://data.um.edu.mo/api-documents/api-operations
      status: 200
    - url: https://data.um.edu.mo/quickstart
      status: 200
    - url: https://data.um.edu.mo/dataset
      status: 200
    - url: https://data.um.edu.mo/data-dictionary
      status: 200
    - url: https://websso.um.edu.mo/FederationMetadata/2007-06/FederationMetadata.xml
      status: 200
    - url: https://websso.um.edu.mo/adfs/.well-known/openid-configuration
      status: 200
    - url: https://login.microsoftonline.com/um.edu.mo/v2.0/.well-known/openid-configuration
      status: 200
    - url: https://ummoodle.um.edu.mo/mod/lti/certs.php
      status: 200
    - url: https://repository.um.edu.mo/oai?verb=Identify
      status: 404
    - url: https://repository.um.edu.mo/api/core/sites
      status: 200
      note: 200 body reads "Your IP is not allowed to access or harvest this resources!"
    - url: https://umlibrary.primo.exlibrisgroup.com/discovery/search?vid=853UOM_INST:umlibrary
      status: 200
    - url: https://chat.genai.um.edu.mo/api/config
      status: 200
