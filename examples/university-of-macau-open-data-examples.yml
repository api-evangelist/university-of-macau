    method: GET
    url: http://api.data.um.edu.mo/service/facilities/access_control_records/all?sort_by=-accessDate
- name: Unauthenticated call — live probe
  operation: events_get_all
  method: probed
  request:
    method: GET
    url: https://api.data.um.edu.mo/service/media/events/all
  response:
    status: 401
    headers:
      WWW-Authenticate: >-
        AzureApiManagementKey realm="https://api.data.um.edu.mo/service/media/events",
        name="Authorization", type="header"
    body:
      statusCode: 401
      message: >-
        Access denied due to missing subscription key. Make sure to include subscription key when
        making requests to an API.
