- name: Sort ascending
  operation: access_control_records_get_all
  request:
    method: GET
    url: http://api.data.um.edu.mo/service/facilities/access_control_records/all?sort_by=accessDate
  note: The documentation prints this example over http; the gateway advertises https only.
- name: Sort descending
  operation: access_control_records_get_all
